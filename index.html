function how(){V(`<h2>How to play</h2><div class="card"><p><b>One phone, passed around.</b> Everyone secretly learns a role. Most are Operatives. A few are Saboteurs.</p><p><b>Each round:</b> every player takes a private turn with Secret Orders (each role sees only its own actions there). Then the team solves a challenge together before the timer ends.</p><p><b>Credits ◆</b> Success earns them, failure costs them. Reach the goal to win. Hit zero and saboteurs win.</p><p><b>Emergency meeting:</b> after a round, discuss, then vote in secret. Ejecting a saboteur earns credits. Ejecting an innocent costs them. A vote is forced every few rounds, and if the rounds run out before the goal, sudden-death votes continue until the saboteur is out or only 2 players remain (saboteurs win).</p><p><b>Saboteurs win</b> if credits hit zero or they equal the operatives in number. <b>Final showdown:</b> if the last saboteur is caught they get one guess at the secret Handler (an operative). Guess right and they steal the win.</p><p>Saboteurs also carry a private mission. Finishing it drains the team.</p><p><b>The Handler</b> is one secret operative who can use Firewall once. If a sabotage was blocked, everyone is told. If not, nobody knows.</p><p><b>Detective</b> (5+ players) investigates one player once. <b>Guardian</b> (7+) shields a player from the next ejection, twice. In meetings, saboteurs can name a hidden role and a player: guess right and that player is removed. Impossible difficulty has brutal questions and tight estimates.</p></div><button class="b" onclick="menu()">Back</button>`)}
